name: Auto Render C4 Architecture Docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Graphviz Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Download PlantUML Jar Executable
        run: |
          wget https://github.com/plantuml/plantuml/releases/download/v1.2023.10/plantuml-1.2023.10.jar -O plantuml.jar

      - name: Lint: enforce methodologist rules (banned macros)
        run: |
          set -e
          if grep -rnE "Rel_(R|L|D|U)\(" src/ ; then
            echo "❌ CRITICAL FAILURE: banned macro Rel_R/Rel_L/Rel_D/Rel_U found."
            echo "Use standard 'Rel()' macro per methodologist guidelines."
            exit 1
          else
            echo "[INFO] No banned positioning macros detected."
          fi

      - name: Validate Syntax and Compile Diagrams to PNG
        run: |
          java -jar plantuml.jar -charset UTF-8 -verbose -png \
            -o "$GITHUB_WORKSPACE/docs/images" "src/**/*.puml"

      - name: Commit and Push Rendered Artifacts
        if: github.event_name == 'push'
        run: |
          git config --global user.name 'DevOps Bot'
          git config --global user.email 'devops@stankin.ru'
          git add docs/images/*.png
          git commit -m 'docs: auto-update architecture diagrams [skip ci]' || echo 'No changes to commit'
          git push
